/**
 * List of tab names.
 * @private
 */
var TABS_ = ['blocks', 'arduino', 'xml'];

var selected = 'blocks';

/**
 * Show a confirm modal dialog.
 * @param {string} message Message to display.
 * @param {function} onConfirm Callback when confirmed.
 */
function showConfirmModal(message, onConfirm) {
  var modalEl = document.getElementById('confirmModal');
  var modal = new bootstrap.Modal(modalEl);
  document.getElementById('confirmModalBody').textContent = message;
  
  var okBtn = document.getElementById('confirmModalOk');
  
  var handleOk = function() {
    // Blur focused element before hiding
    document.activeElement.blur();
    modal.hide();
    if (onConfirm) onConfirm();
    cleanup();
  };
  
  var cleanup = function() {
    okBtn.removeEventListener('click', handleOk);
    modalEl.removeEventListener('hidden.bs.modal', cleanup);
  };
  
  // Blur focused element when modal is about to hide
  modalEl.addEventListener('hide.bs.modal', function() {
    document.activeElement.blur();
  }, { once: true });
  
  okBtn.addEventListener('click', handleOk);
  modalEl.addEventListener('hidden.bs.modal', cleanup);
  modal.show();
}

/**
 * Show an alert modal dialog.
 * @param {string} message Message to display.
 */
function showAlertModal(message) {
  var modal = new bootstrap.Modal(document.getElementById('alertModal'));
  document.getElementById('alertModalBody').textContent = message;
  modal.show();
}

/**
 * Show a prompt modal dialog with input field.
 * @param {string} message Message to display.
 * @param {string} defaultValue Default value for input.
 * @param {function} onConfirm Callback with input value when confirmed.
 */
function showPromptModal(message, defaultValue, onConfirm) {
  var modalEl = document.getElementById('promptModal');
  var modal = new bootstrap.Modal(modalEl);
  document.getElementById('promptModalMessage').textContent = message;
  var input = document.getElementById('promptModalInput');
  input.value = defaultValue || '';
  
  var okBtn = document.getElementById('promptModalOk');
  
  var handleOk = function() {
    var value = input.value;
    // Blur focused element before hiding
    document.activeElement.blur();
    modal.hide();
    if (onConfirm && value) onConfirm(value);
  };
  
  var handleEnter = function(e) {
    if (e.key === 'Enter') {
      handleOk();
    }
  };
  
  var cleanup = function() {
    okBtn.removeEventListener('click', handleOk);
    input.removeEventListener('keypress', handleEnter);
    modalEl.removeEventListener('hidden.bs.modal', cleanup);
  };
  
  // Blur focused element when modal is about to hide
  modalEl.addEventListener('hide.bs.modal', function() {
    document.activeElement.blur();
  }, { once: true });
  
  okBtn.addEventListener('click', handleOk);
  input.addEventListener('keypress', handleEnter);
  modalEl.addEventListener('hidden.bs.modal', cleanup);
  
  modal.show();
  
  // Focus input after modal is shown
  modalEl.addEventListener('shown.bs.modal', function() {
    input.focus();
    input.select();
  }, { once: true });
}

/**
 * Switch the visible pane when a tab is clicked.
 * @param {string} clickedName Name of tab clicked.
 */
function tabClick(clickedName) {
  // If the XML tab was open, save and render the content.
  if (document.getElementById('tab_xml').classList.contains('active')) {
    var xmlTextarea = document.getElementById('content_xml');
    var xmlText = xmlTextarea.value;
    var xmlDom = null;
    try {
      xmlDom = Blockly.Xml.textToDom(xmlText);
    } catch (e) {
      showConfirmModal('Error parsing XML:\n' + e + '\n\nAbandon changes?', function() {
        // User confirmed - abandon changes
        switchTab(clickedName);
      });
      return;
    }
    if (xmlDom) {
      Blockly.mainWorkspace.clear();
      Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, xmlDom);
    }
  }

  switchTab(clickedName);
}

/**
 * Internal function to switch tabs.
 */
function switchTab(clickedName) {
  if (document.getElementById('tab_blocks').classList.contains('active')) {
    Blockly.mainWorkspace.setVisible(false);
  }
  // Deselect all tabs and hide all panes.
  for (var i = 0; i < TABS_.length; i++) {
    var name = TABS_[i];
    document.getElementById('tab_' + name).classList.remove('active');
    document.getElementById('content_' + name).style.visibility = 'hidden';
  }

  // Select the active tab.
  selected = clickedName;
  document.getElementById('tab_' + clickedName).classList.add('active');
  // Show the selected pane.
  document.getElementById('content_' + clickedName).style.visibility =
      'visible';
  renderContent();
  if (clickedName == 'blocks') {
    Blockly.mainWorkspace.setVisible(true);
  }
  Blockly.fireUiEvent(window, 'resize');
}

/**
 * Populate the currently selected pane with content generated from the blocks.
 */
function renderContent() {
  var content = document.getElementById('content_' + selected);
  // Initialize the pane.
  if (content.id == 'content_blocks') {
    // If the workspace was changed by the XML tab, Firefox will have performed
    // an incomplete rendering due to Blockly being invisible.  Rerender.
    Blockly.mainWorkspace.render();
  } else if (content.id == 'content_xml') {
    var xmlTextarea = document.getElementById('content_xml');
    var xmlDom = Blockly.Xml.workspaceToDom(Blockly.mainWorkspace);
    var xmlText = Blockly.Xml.domToPrettyText(xmlDom);
    xmlTextarea.value = xmlText;
    xmlTextarea.focus();
  /*} else if (content.id == 'content_javascript') {
    content.innerHTML = Blockly.JavaScript.workspaceToCode();
  } else if (content.id == 'content_dart') {
    content.innerHTML = Blockly.Dart.workspaceToCode();
  } else if (content.id == 'content_python') {
    content.innerHTML = Blockly.Python.workspaceToCode();*/
  } else if (content.id == 'content_arduino') {
    //content.innerHTML = Blockly.Arduino.workspaceToCode();
    var arduinoTextarea = document.getElementById('content_arduino');
    arduinoTextarea.value = Blockly.Arduino.workspaceToCode(Blockly.mainWorkspace);
    arduinoTextarea.focus();
  }
}

/**
 * Add icons to toolbox categories.
 */
function addToolboxIcons() {
  var toolbox = document.querySelector('.blocklyToolboxDiv');
  if (!toolbox) {
    setTimeout(addToolboxIcons, 100);
    return;
  }
  
  var treeRows = document.querySelectorAll('.blocklyTreeRow');
  if (treeRows.length === 0) {
    setTimeout(addToolboxIcons, 100);
    return;
  }
  
  treeRows.forEach(function(row) {
    var label = row.querySelector('.blocklyTreeLabel');
    if (!label) return;
    
    var text = label.textContent.trim();
    if (!text) return;
    
    // Check if this is a subcategory (SG90 Servo or Internal LED)
    var isSubcategory = text === 'SG90 Servo' || text === 'Internal LED';
    
    // Add indentation for subcategories
    if (isSubcategory) {
      row.style.setProperty('padding-left', '24px', 'important');
      row.style.setProperty('margin-left', '8px', 'important');
      row.style.setProperty('background-color', '#f8f9fa', 'important');
    }
    
    // Only Playground has subcategories - add arrow
    if (text === 'Playground') {
      var arrow = row.querySelector('.tree-arrow');
      if (!arrow) {
        var rowContainer = row.parentElement;
        var isExpanded = rowContainer && rowContainer.getAttribute('aria-expanded') === 'true';
        arrow = document.createElement('i');
        arrow.className = 'bi ' + (isExpanded ? 'bi-chevron-down' : 'bi-chevron-right') + ' tree-arrow';
        arrow.style.display = 'inline-block';
        arrow.style.marginRight = '8px';
        label.parentNode.insertBefore(arrow, label);
      }
      return; // Skip icon for Playground
    }
    
    // Add icons for other categories
    var iconClass = '';
    if (text === 'Logic') iconClass = 'bi-diagram-3';
    else if (text === 'Constants') iconClass = 'bi-lightbulb';
    else if (text === 'Control') iconClass = 'bi-clock';
    else if (text === 'Math') iconClass = 'bi-calculator';
    else if (text === 'Text') iconClass = 'bi-type';
    else if (text === 'Variables') iconClass = 'bi-boxes';
    else if (text === 'Functions') iconClass = 'bi-code-square';
    else if (text === 'Input/Output') iconClass = 'bi-cpu';
    else if (text === 'SG90 Servo') iconClass = 'bi-gear';
    else if (text === 'Internal LED') iconClass = 'bi-lightbulb-fill';
    
    if (iconClass) {
      var icon = row.querySelector('.toolbox-icon');
      if (!icon) {
        icon = document.createElement('i');
        icon.className = 'bi ' + iconClass + ' toolbox-icon';
        icon.style.display = 'inline-block';
        icon.style.marginRight = '8px';
        label.parentNode.insertBefore(icon, label);
      }
    }
  });
  
  updateTreeArrows();
}

function updateTreeArrows() {
  var playgroundRow = document.querySelector('.blocklyTreeLabel');
  if (!playgroundRow || playgroundRow.textContent.trim() !== 'Playground') {
    playgroundRow = null;
    var labels = document.querySelectorAll('.blocklyTreeLabel');
    labels.forEach(function(l) {
      if (l.textContent.trim() === 'Playground') {
        playgroundRow = l;
      }
    });
  }
  
  if (playgroundRow) {
    var row = playgroundRow.closest('.blocklyTreeRow');
    var arrow = row ? row.querySelector('.tree-arrow') : null;
    if (arrow) {
      var rowContainer = row.parentElement;
      var isExpanded = rowContainer && rowContainer.getAttribute('aria-expanded') === 'true';
      arrow.className = 'bi ' + (isExpanded ? 'bi-chevron-down' : 'bi-chevron-right') + ' tree-arrow';
    }
  }
}

// Watch for tree changes and update arrows
var toolboxObserverTimeout = null;
function observeTreeChanges() {
  var toolbox = document.querySelector('.blocklyToolboxDiv');
  if (!toolbox) {
    setTimeout(observeTreeChanges, 100);
    return;
  }
  
  // Use MutationObserver to watch for DOM changes
  var observer = new MutationObserver(function(mutations) {
    // Debounce: only run once after changes stop
    if (toolboxObserverTimeout) {
      clearTimeout(toolboxObserverTimeout);
    }
    toolboxObserverTimeout = setTimeout(function() {
      addToolboxIcons();
    }, 100);
  });
  
  observer.observe(toolbox, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ['class']
  });
  
  // Also update arrows on click
  toolbox.addEventListener('click', function(e) {
    setTimeout(updateTreeArrows, 50);
  });
  
  updateTreeArrows();
}

/**
 * Initialize Blockly.  Called on page load.
 */
function init() {
  //window.onbeforeunload = function() {
  //  return 'Leaving this page will result in the loss of your work.';
  //};

  var container = document.querySelector('.main-content');
  var onresize = function(e) {
    var bBox = {
      x: 0,
      y: 0,
      height: container.offsetHeight,
      width: container.offsetWidth
    };
    for (var i = 0; i < TABS_.length; i++) {
      var el = document.getElementById('content_' + TABS_[i]);
      el.style.top = '0';
      el.style.left = '0';
      el.style.height = bBox.height + 'px';
      el.style.width = bBox.width + 'px';
    }
  };
  window.addEventListener('resize', onresize, false);

  var toolbox = document.getElementById('toolbox');
  Blockly.inject(document.getElementById('content_blocks'),
      {grid:
          {spacing: 25,
           length: 3,
           colour: '#ccc',
           snap: true},
       media: '../../media/',
       toolbox: toolbox,
       sounds: false});

  // Add icons to toolbox categories
  setTimeout(addToolboxIcons, 200);
  
  // Watch for tree changes
  setTimeout(observeTreeChanges, 300);

  auto_save_and_restore_blocks();

  //load from url parameter (single param)
  //http://stackoverflow.com/questions/2090551/parse-query-string-in-javascript
  var dest = unescape(location.search.replace(/^.*\=/, '')).replace(/\+/g, " ");
  if(dest){
    load_by_url(dest);
  }
  
  // Initial resize
  onresize();
}

    </div>
  </div>

  <!-- Prompt Modal -->
  <div class="modal fade" id="promptModal" tabindex="-1" aria-labelledby="promptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="promptModalLabel">Input Required</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="promptModalMessage"></p>
          <input type="text" class="form-control" id="promptModalInput" placeholder="">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="promptModalCancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="promptModalOk">OK</button>
        </div>
      </div>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="Logic">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_null"></block>
    </category>
    <category name="Constants">
      <block type="constants_true"></block>
      <block type="constants_false"></block>
    </category>
    <category name="Control">
      <block type="base_delay">
        <value name="DELAY_TIME">
          <block type="math_number">
            <field name="NUM">1000</field>
          </block>
        </value>
      </block>
      <block type="controls_for">
        <value name="FROM">
          <block type="math_number">
            <field name="NUM">1</field>
          </block>
        </value>
        <value name="TO">
          <block type="math_number">
            <field name="NUM">10</field>
          </block>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="Math">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="base_map">
        <value name="DMAX">
          <block type="math_number">
            <field name="NUM">180</field>
          </block>
        </value>
      </block>
    </category>
    <category name="Text">
      <block type="text"></block>
    </category>
    <category name="Variables" custom="VARIABLE"></category>
    <category name="Functions" custom="PROCEDURE"></category>
    <sep></sep>
    <category name="Input/Output">
      <block type="inout_highlow"></block>
      <block type="inout_digital_write"></block>
      <block type="inout_digital_read"></block>
      <block type="inout_analog_write">
        <value name="NUM">
          <block type="math_number">
            <field name="NUM">0</field>
          </block>
        </value>
      </block>
      <block type="inout_analog_read"></block>
      <block type="serial_print">
        <value name="CONTENT">
          <block type="text">
            <field name="TEXT"></field>
          </block>
        </value>
      </block>
      <block type="inout_tone">
        <value name="NUM">
          <block type="math_number">
            <field name="NUM">440</field>
          </block>
        </value>
      </block>
      <block type="inout_notone"></block>
    </category>
    <category name="Playground">
      <category name="SG90 Servo">
        <block type="servo_sg90_init"></block>
        <block type="servo_sg90_move">
          <value name="DEGREE">
            <block type="math_number">
              <field name="NUM">0</field>
            </block>
          </value>
        </block>
        <block type="servo_sg90_read_degrees"></block>
      </category>
      <category name="Internal LED">
        <block type="internal_led_init"></block>
        <block type="internal_led_set">
          <value name="RED">
            <block type="math_number">
              <field name="NUM">255</field>
            </block>
          </value>
          <value name="GREEN">
            <block type="math_number">
              <field name="NUM">0</field>
            </block>
          </value>
          <value name="BLUE">
            <block type="math_number">
              <field name="NUM">0</field>
            </block>
          </value>
        </block>
        <block type="internal_led_off"></block>
      </category>
    </category>
  </xml>
  <script src="lib/bootstrap.bundle.min.js"></script>
</body>
</html>
